<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0e1014">
    <title>Batimento</title>
    <style>
      :root{
        --bg:#0e1014; --card:#171a21; --card2:#1f232c; --line:#2a2f3a;
        --fg:#e9edf5; --dim:#8a93a6; --accent:#3fc1ff; --warm:#ff8a5b;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;background:var(--bg);color:var(--fg);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        -webkit-text-size-adjust:100%}
      body{max-width:560px;margin:0 auto;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}

      header{display:flex;align-items:baseline;gap:10px;margin:2px 2px 14px}
      h1{font-size:17px;margin:0;letter-spacing:-.2px;white-space:nowrap;flex:1}
      .sub{font-size:12px;color:var(--dim);flex:2}
      #langBtn{flex:none;background:var(--card2);border:1px solid var(--line);
        border-radius:8px;padding:4px 8px;font-size:11.5px;color:var(--dim);
        font-variant-numeric:tabular-nums;letter-spacing:.4px}
      #langBtn:active{background:#264b5f;color:#cfeaff}

      button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

      #play{width:100%;padding:17px;border-radius:16px;font-size:17px;font-weight:600;
        background:linear-gradient(180deg,#2b8fd6,#1f6ea8);color:#fff;
        box-shadow:0 6px 20px rgba(0,0,0,.35);margin-bottom:12px;transition:transform .08s}
      #play:active{transform:scale(.985)}
      #play.on{background:linear-gradient(180deg,#d6553f,#a83a29)}

      .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px}
      .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
      .lbl{font-size:12.5px;color:var(--dim);letter-spacing:.2px}
      .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

      .viz-card{padding:10px 10px 8px}
      canvas{width:100%;height:150px;display:block;border-radius:9px;background:#0a0c10}
      .viz-readout{display:flex;justify-content:space-between;align-items:center;gap:8px;
        padding:7px 4px 2px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
      .viz-readout b{color:#b9c3d6;font-weight:600}
      .beat-pill{background:#1d3a4d;color:#9fd8ff;border-radius:999px;padding:3px 10px;
        font-size:11.5px;font-weight:600;white-space:nowrap}

      input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:2px 0 0}
      input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--card2)}
      input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
        background:var(--accent);margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
      input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--card2)}
      input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:var(--accent)}

      .vol input[type=range]{height:26px}
      .vol input[type=range]::-webkit-slider-runnable-track{height:4px}
      .vol input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:-8px}
      .vol input[type=range]::-moz-range-track{height:4px}
      .vol input[type=range]::-moz-range-thumb{width:20px;height:20px}

      .step-row{display:flex;gap:8px;margin-top:8px;align-items:stretch}
      .step-row button{flex:1;padding:9px 4px;border-radius:10px;background:var(--card2);
        font-size:12.5px;color:var(--dim);white-space:nowrap}
      .step-row button:active{background:#264b5f;color:#cfeaff}
      #fInput{flex:1.2;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;
        color:var(--fg);font:inherit;font-size:14px;font-variant-numeric:tabular-nums;
        text-align:center;padding:8px 4px;outline:none}
      #fInput:focus{border-color:#2f6d92}

      .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
      .chips button{flex:1;min-width:40px;padding:8px 2px;border-radius:9px;background:var(--card2);
        font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--dim)}
      .chips button.on{background:#264b5f;color:#cfeaff}

      .mini{margin-top:9px;width:100%;padding:9px;border-radius:9px;background:var(--card2);
        font-size:12.5px;color:#cfeaff}
      .mini.on{background:#5a2f22;color:#ffd6c6}

      .note{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:8px}
      .note b{color:#b9c3d6;font-weight:600}

      .foot{display:flex;align-items:center;gap:10px}
      .foot svg{flex:none;opacity:.75}
      #vVal{font-size:11.5px;color:var(--dim);width:36px;text-align:right;font-variant-numeric:tabular-nums}

      details{margin-top:4px}
      summary{font-size:12px;color:var(--dim);cursor:pointer;padding:3px 0}
      details p{font-size:12px;color:var(--dim);line-height:1.6;margin:8px 0}
    </style>
  </head>

  <body>
    <header>
      <h1 id="title">Batimento</h1>
      <span class="sub" id="subtitle">duas ondas em L / R — o batimento acontece no ar</span>
      <button id="langBtn" aria-label="language">PT</button>
    </header>

    <button id="play">▶ Tocar</button>

    <section class="card viz-card">
      <canvas id="viz"></canvas>
      <div class="viz-readout">
        <span>◀ L <b id="roA">260.6 Hz</b></span>
        <span class="beat-pill" id="roBeat">2.0 Hz</span>
        <span><b id="roB">262.6 Hz</b> R ▶</span>
      </div>
    </section>

    <section class="card">
      <div class="row"><span class="lbl" id="lblFreq">Frequência central</span><span class="val" id="fNote">C4</span></div>
      <input type="range" id="fSlider" min="0" max="1" step="0.001">
      <div class="step-row">
        <button id="semiDown">− semitom</button>
        <input type="number" id="fInput" inputmode="decimal" min="20" max="4000" step="0.1" value="261.6">
        <button id="semiUp">+ semitom</button>
      </div>
    </section>

    <section class="card">
      <div class="row"><span class="lbl" id="lblBeat">Taxa de batimento</span><span class="val" id="bVal">2.00 Hz</span></div>
      <input type="range" id="bSlider" min="0" max="1" step="0.001">
      <div class="chips" id="chips"></div>
      <button class="mini" id="sweep">▸ varrer a diferença (0 → 60 Hz)</button>
      <div class="note" id="bNote"></div>
    </section>

    <footer class="card foot vol">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b9c3d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#b9c3d6" stroke="none"></polygon>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
      </svg>
      <input type="range" id="vSlider" min="0" max="1" step="0.01" aria-label="Volume">
      <span id="vVal">60%</span>
      <details style="flex:none">
        <summary id="infoSum">info</summary>
      </details>
    </footer>

    <div class="card" id="infoCard" style="display:none">
      <p style="font-size:12px;color:var(--dim);line-height:1.6;margin:0" id="infoBody"></p>
    </div>

    <script>
      (function () {
      "use strict";

      /* ------------------------------------------------------------- i18n table */
      const I18N = {
        pt: {
          title: 'Batimento',
          subtitle: 'duas ondas em L / R — o batimento acontece no ar',
          play: '▶ Tocar',
          stop: '■ Parar',
          labelFreq: 'Frequência central',
          labelBeat: 'Taxa de batimento',
          semitoneDown: '− semitom',
          semitoneUp: '+ semitom',
          sweepIdle: '▸ varrer a diferença (0 → 60 Hz)',
          sweepActive: '■ parar varredura',
          infoSummary: 'info',
          infoBody:
            '<b style="color:#b9c3d6">O que você está ouvindo:</b> a onda A (alto-falante esquerdo) e a onda B ' +
            '(direito) são tocadas com panning duro, uma em cada lado. As duas chegam aos dois ouvidos — em ' +
            'boa parte — e interferem no ambiente, não na sua cabeça. Onde as ondas se somam em fase você ' +
            'escuta um reforço; onde se cancelam, um silêncio. Esse é o batimento: <b style="color:#b9c3d6">' +
            '|f_A − f_B|</b> reforços por segundo.' +
            '<br><br><b style="color:#b9c3d6">A geometria importa:</b> os dois alto-falantes estão em pontos ' +
            'diferentes, então o padrão de interferência depende de onde você está. Mexa a cabeça e a ' +
            'profundidade do batimento muda. Isso é física real. De fone, cada ouvido recebe apenas um tom ' +
            'e você ouviria batimentos binaurais — fenômeno diferente, motivo pelo qual mantivemos o panning duro.' +
            '<br><br><b style="color:#b9c3d6">O gráfico:</b> a faixa sombreada é o envelope da soma — a altura ' +
            'em cada ponto vale ±2·|cos(π·Δf·t)|, ou seja, a amplitude da interferência. A curva clara dentro é ' +
            'uma fatia congelada da onda portadora; ela não se mexe, para não distrair. Só o ponto na borda ' +
            'direita se move, seguindo o volume real. A janela mostra 3 segundos reais: conforme Δf se aproxima ' +
            'de 0, o envelope vai ficando visivelmente mais raso e liso, até virar uma reta em Δf = 0.',
          roBeat: 'Hz de batimento',
          beatEvery: '1 batimento a cada',
          regimeSlow: 'onda lenta — um ciclo a cada {s} s',
          regimeClear: 'batimento rítmico claro',
          regimeFlutter: 'flutuação rápida',
          regimeRough: 'aspereza — os tons se fundem num zumbido',
          regimeTwo: 'dois tons separados (fora da banda crítica)',
          regimeZero: 'sem batimento — uma só frequência',
          hz: 'Hz',
          ms: 'ms'
        },
        en: {
          title: 'Beat Interference',
          subtitle: 'two tones panned L / R — the beat happens in the air',
          play: '▶ Play',
          stop: '■ Stop',
          labelFreq: 'Centre frequency',
          labelBeat: 'Beat rate = spread',
          semitoneDown: '− semitone',
          semitoneUp: '+ semitone',
          sweepIdle: '▸ sweep the spread (0 → 60 Hz)',
          sweepActive: '■ stop sweep',
          infoSummary: 'info',
          infoBody:
            '<b style="color:#b9c3d6">What you\'re hearing:</b> tone A (left speaker) and tone B (right) are ' +
            'hard-panned to opposite sides. Both reach both ears — mostly — and interfere in the room, not in ' +
            'your head. Where the waves add in phase you hear a swell; where they cancel, a dip. That\'s the ' +
            'beat: <b style="color:#b9c3d6">|f_A − f_B|</b> swells per second.' +
            '<br><br><b style="color:#b9c3d6">Geometry matters:</b> the two drivers are in different places, so ' +
            'the interference pattern depends on where you sit. Move your head and the beat depth changes. ' +
            'That\'s real physics. On headphones each ear gets only one tone and you\'d hear binaural beats — ' +
            'a different phenomenon, which is why we kept the panning hard.' +
            '<br><br><b style="color:#b9c3d6">The graph:</b> the shaded band is the envelope of the sum — its ' +
            'height at every point equals ±2·|cos(π·Δf·t)|, i.e. the interference amplitude. The pale curve ' +
            'inside is one frozen slice of the carrier wave; it does not move, so the eye is not distracted. ' +
            'Only the dot at the right edge moves, following the true loudness. The window shows 3 real ' +
            'seconds: as Δf approaches 0 the envelope visibly flattens and smooths until it becomes a ' +
            'straight line at Δf = 0.',
          roBeat: 'Hz beat',
          beatEvery: '1 beat every',
          regimeSlow: 'slow swell — one cycle every {s} s',
          regimeClear: 'clear rhythmic beating',
          regimeFlutter: 'fast flutter',
          regimeRough: 'roughness — the tones fuse into a buzz',
          regimeTwo: 'two separate tones (outside the critical band)',
          regimeZero: 'no beat — a single frequency',
          hz: 'Hz',
          ms: 'ms'
        }
      };
      let LANG = 'pt';
      const T = k => I18N[LANG][k];

      /* ------------------------------------------------------------------ state */
      const S = { freq: 261.6256, beat: 2.0, vol: 0.6 };

      /* ------------------------------------------------------- slider mappings */
      const F_MIN = 60, F_MAX = 1200, B_MAX = 80;
      const fFromSlider = v => F_MIN * Math.pow(F_MAX / F_MIN, v);
      const sliderFromF = f => Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN);

      const bFromSlider = v => B_MAX * Math.pow(Math.max(0, Math.min(1, v)), 2.2);
      const sliderFromB = b => Math.pow(Math.max(0, Math.min(B_MAX, b)) / B_MAX, 1 / 2.2);

      /* ------------------------------------------------------------ note names */
      const NOTES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
      function noteOf(f) {
        const m = 69 + 12 * Math.log2(f / 440);
        const n = Math.round(m);
        return {
          name: NOTES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1),
          cents: Math.round((m - n) * 100)
        };
      }
      function erb(f) { return 24.7 * (4.37 * f / 1000 + 1); }

      function regimeKey(f, b) {
        if (b <= 0) return 'regimeZero';
        const e = erb(f);
        if (b < 0.8) return 'regimeSlow';
        if (b < 8)   return 'regimeClear';
        if (b < 0.5 * e) return 'regimeFlutter';
        if (b < e)   return 'regimeRough';
        return 'regimeTwo';
      }
      function regimeText(f, b) {
        const k = regimeKey(f, b);
        let s = T(k);
        if (k === 'regimeSlow') s = s.replace('{s}', (1 / b).toFixed(1));
        return s;
      }

      /* ------------------------------------------------------------------- DOM */
      const $ = s => document.querySelector(s);
      const fSlider = $('#fSlider'), bSlider = $('#bSlider'), vSlider = $('#vSlider');
      const fInput  = $('#fInput');
      const playBtn = $('#play'), sweepBtn = $('#sweep');
      const cv = $('#viz'), cx = cv.getContext('2d');

      /* ----------------------------------------------------------------- audio */
      let ac = null, oscA = null, oscB = null, panA = null, panB = null, master = null;
      let running = false;
      let audioStart = 0;

      function initAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        ac = new AC({ latencyHint: 'interactive' });

        master = ac.createGain();
        master.gain.value = 0;
        master.connect(ac.destination);

        oscA = ac.createOscillator(); oscA.type = 'sine';
        oscB = ac.createOscillator(); oscB.type = 'sine';

        const gA = ac.createGain(); gA.gain.value = 0.5;
        const gB = ac.createGain(); gB.gain.value = 0.5;

        panA = ac.createStereoPanner(); panA.pan.value = -1;
        panB = ac.createStereoPanner(); panB.pan.value =  1;

        oscA.connect(gA); gA.connect(panA); panA.connect(master);
        oscB.connect(gB); gB.connect(panB); panB.connect(master);

        oscA.start(0);
        oscB.start(0);
        audioStart = ac.currentTime;
        applyFreqs();
      }

      function rampParam(p, v, tc) {
        const t = ac.currentTime;
        if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
        else p.cancelScheduledValues(t);
        p.setTargetAtTime(v, t, tc || 0.015);
      }

      function rampGain(target, dur) {
        const p = master.gain, t = ac.currentTime;
        if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
        else p.cancelScheduledValues(t);
        p.linearRampToValueAtTime(target, t + dur);
      }

      function applyFreqs() {
        if (!ac) return;
        const half = S.beat / 2;
        rampParam(oscA.frequency, Math.max(S.freq - half, 1));
        rampParam(oscB.frequency, Math.max(S.freq + half, 1));
      }

      function applyVolume(dur) {
        if (!ac) return;
        rampGain(running ? S.vol * 0.8 : 0, dur === undefined ? 0.12 : dur);
      }

      /* ------------------------------------------------------------ wake lock */
      let wakeLock = null;
      async function requestWake() {
        try {
          if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) { /* ignore */ }
      }
      function releaseWake() {
        if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && running) requestWake();
      });

      /* -------------------------------------------------------------- controls */
      async function togglePlay() {
        if (!ac) initAudio();
        if (ac.state === 'suspended') { try { await ac.resume(); } catch (e) {} }

        if (running) {
          running = false;
          applyVolume(0.15);
          playBtn.textContent = T('play');
          playBtn.classList.remove('on');
          releaseWake();
        } else {
          running = true;
          audioStart = ac.currentTime;
          applyFreqs();
          applyVolume(0.15);
          playBtn.textContent = T('stop');
          playBtn.classList.add('on');
          requestWake();
        }
      }
      playBtn.addEventListener('click', togglePlay);

      fSlider.addEventListener('input', () => {
        S.freq = fFromSlider(parseFloat(fSlider.value));
        applyFreqs(); syncLabels();
      });
      fInput.addEventListener('change', () => {
        let f = parseFloat(fInput.value);
        if (!isFinite(f)) f = S.freq;
        setFreq(Math.min(Math.max(f, 20), 4000));
      });
      function setFreq(f) {
        S.freq = f;
        fSlider.value = sliderFromF(Math.min(Math.max(f, F_MIN), F_MAX));
        applyFreqs(); syncLabels();
      }
      $('#semiDown').addEventListener('click', () => setFreq(S.freq / Math.pow(2, 1 / 12)));
      $('#semiUp').addEventListener('click',   () => setFreq(S.freq * Math.pow(2, 1 / 12)));

      bSlider.addEventListener('input', () => {
        stopSweep();
        S.beat = bFromSlider(parseFloat(bSlider.value));
        applyFreqs(); syncLabels();
      });

      vSlider.addEventListener('input', () => {
        S.vol = parseFloat(vSlider.value);
        if (running) applyVolume(0.06);
        syncLabels();
      });

      /* chips — include 0 */
      const CHIPS = [0, 0.5, 1, 2, 3, 4, 5, 6, 8, 12, 20];
      const chipBox = $('#chips');
      CHIPS.forEach(v => {
        const b = document.createElement('button');
        b.textContent = v === 0 ? '0' : (v < 1 ? v.toFixed(1) : String(v));
        b.dataset.v = v;
        b.addEventListener('click', () => {
          stopSweep();
          S.beat = v;
          bSlider.value = sliderFromB(v);
          applyFreqs(); syncLabels();
        });
        chipBox.appendChild(b);
      });

      let sweeping = false, sweepStart = 0;
      const SWEEP_DUR = 22;
      function stopSweep() {
        sweeping = false;
        sweepBtn.classList.remove('on');
        sweepBtn.textContent = T('sweepIdle');
      }
      sweepBtn.addEventListener('click', async () => {
        if (!ac) initAudio();
        if (ac.state === 'suspended') { try { await ac.resume(); } catch (e) {} }
        if (!running) { await togglePlay(); }
        sweeping = !sweeping;
        sweepBtn.classList.toggle('on', sweeping);
        if (sweeping) { sweepStart = ac.currentTime; sweepBtn.textContent = T('sweepActive'); }
        else stopSweep();
      });

      const infoSummary = document.querySelector('.foot summary');
      const infoCard = $('#infoCard');
      infoSummary.addEventListener('click', e => {
        e.preventDefault();
        infoCard.style.display = infoCard.style.display === 'none' ? 'block' : 'none';
      });

      $('#langBtn').addEventListener('click', () => {
        LANG = LANG === 'pt' ? 'en' : 'pt';
        document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
        applyLanguage();
        syncLabels();
      });

      function applyLanguage() {
        $('#title').textContent = T('title');
        $('#subtitle').textContent = T('subtitle');
        $('#langBtn').textContent = LANG === 'pt' ? 'PT' : 'EN';
        playBtn.textContent = running ? T('stop') : T('play');
        $('#lblFreq').textContent = T('labelFreq');
        $('#lblBeat').textContent = T('labelBeat');
        $('#semiDown').textContent = T('semitoneDown');
        $('#semiUp').textContent = T('semitoneUp');
        $('#infoSum').textContent = T('infoSummary');
        $('#infoBody').innerHTML = T('infoBody');
        sweepBtn.textContent = sweeping ? T('sweepActive') : T('sweepIdle');
        document.title = T('title');
      }

      /* ---------------------------------------------------------------- labels */
      function syncLabels() {
        const b = S.beat, fa = S.freq - b / 2, fb = S.freq + b / 2;
        const nc = noteOf(S.freq);

        $('#fNote').textContent = nc.name + (nc.cents ? ' ' + (nc.cents > 0 ? '+' : '') + nc.cents + '¢' : '');
        fInput.value = S.freq < 100 ? S.freq.toFixed(1) : Math.round(S.freq);
        $('#bVal').textContent = (b < 10 ? b.toFixed(2) : b.toFixed(1)) + ' ' + T('hz');
        $('#vVal').textContent = Math.round(S.vol * 100) + '%';

        $('#roA').textContent = fa.toFixed(1) + ' ' + T('hz');
        $('#roB').textContent = fb.toFixed(1) + ' ' + T('hz');
        $('#roBeat').textContent = b.toFixed(b < 10 ? 2 : 1) + ' ' + T('roBeat');

        $('#bNote').innerHTML =
          T('beatEvery') + ' <b>' + (b > 0 ? (1000 / b).toFixed(0) : '∞') + ' ' + T('ms') + '</b> · ' +
          'L = ' + fa.toFixed(1) + ' ' + T('hz') + ', R = ' + fb.toFixed(1) + ' ' + T('hz') +
          '<br>Regime: <b>' + regimeText(S.freq, b) + '</b>';

        [...chipBox.children].forEach(x => {
          x.classList.toggle('on', Math.abs(parseFloat(x.dataset.v) - b) < 1e-6);
        });
      }

      /* ------------------------------------------------------------ visualiser
        One fixed time window (3 real seconds) across the canvas. The envelope
        is env(t) = |cos(pi * S.beat * t)| using the real beat rate, so:
          - at 2 Hz   -> 6 cycles across the window
          - at 0.5 Hz -> 1.5 cycles, visibly shallower
          - at 0.05 Hz-> ~0.15 of a cycle, almost flat
          - at 0      -> exactly 1 everywhere, a straight line
        No mode switch, no special case: the flattening is continuous. */
      const WIN_SEC     = 3;      // real seconds visible on the canvas
      const MARGIN      = 10;     // px of headroom top & bottom
      const CARRIER_MIN = 6;      // visible carrier cycles at F_MIN
      const CARRIER_MAX = 60;     // visible carrier cycles at F_MAX

      let carrier = null, carrierW = 0, carrierN = 0, carrierCyc = 0;

      function fitCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = cv.clientWidth || 300, h = cv.clientHeight || 150;
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildCarrier(w);
      }
      window.addEventListener('resize', fitCanvas);

      function cyclesForFreq(f) {
        const t = Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN);
        const x = Math.max(0, Math.min(1, t));
        return Math.round(CARRIER_MIN + (CARRIER_MAX - CARRIER_MIN) * x);
      }

      function buildCarrier(w) {
        const n = Math.max(200, w * 2);
        const cyc = cyclesForFreq(S.freq);
        const arr = new Float32Array(n + 1);
        for (let i = 0; i <= n; i++) {
          arr[i] = Math.sin(2 * Math.PI * cyc * (i / n));
        }
        carrier = arr; carrierW = w; carrierN = n; carrierCyc = cyc;
      }

      function draw(tau) {
        const w = cv.clientWidth, h = cv.clientHeight;
        if (!w || !h) return;
        if (!carrier || carrierW !== w || carrierCyc !== cyclesForFreq(S.freq)) {
          buildCarrier(w);
        }

        const mid = h / 2;
        const amp = Math.max(10, (mid - MARGIN) / 2);

        /* Fixed real-time window, so the picture morphs continuously with beat.
          At beat=0 the window is still 3 s of "one steady tone". */
        const win = WIN_SEC;
        const t0  = tau - win;

        /* Envelope with the real beat rate — no special-casing. At beat=0 this
          is identically 1 for all t, which is the correct constant amplitude
          of sin(A)+sin(A). */
        const env = t => Math.abs(Math.cos(Math.PI * S.beat * t));

        cx.clearRect(0, 0, w, h);

        /* centre line */
        cx.beginPath(); cx.moveTo(0, mid); cx.lineTo(w, mid);
        cx.strokeStyle = 'rgba(255,255,255,.10)';
        cx.lineWidth = 1;
        cx.stroke();

        /* silence-node verticals — only draw when beats are actually visible
          in the window (skip when beat is 0). */
        if (S.beat > 0) {
          cx.strokeStyle = 'rgba(255,255,255,.06)';
          const k0 = Math.ceil(S.beat * t0 - 0.5);
          const k1 = Math.floor(S.beat * tau - 0.5);
          for (let k = k0; k <= k1; k++) {
            const x = ((k + 0.5) / S.beat - t0) / win * w;
            if (x < 0 || x > w) continue;
            cx.beginPath(); cx.moveTo(x, 6); cx.lineTo(x, h - 6); cx.stroke();
          }
        }

        /* dashed theoretical envelope ±2·env (blue). At beat=0 this is a pair
          of straight horizontal lines at ±2·amp — the correct sum's constant
          envelope. As beat decreases it smoothly flattens; no jump. */
        cx.setLineDash([4, 4]);
        cx.strokeStyle = 'rgba(63,193,255,.85)';
        cx.lineWidth = 1.4;
        for (const sign of [-1, 1]) {
          cx.beginPath();
          for (let x = 0; x <= w; x += 2) {
            const t = t0 + (x / w) * win;
            const y = mid + sign * 2 * env(t) * amp;
            x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
          }
          cx.stroke();
        }
        cx.setLineDash([]);

        /* shaded band between -env and +env */
        cx.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const t = t0 + (x / w) * win;
          const y = mid - 2 * env(t) * amp;
          x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
        }
        for (let x = w; x >= 0; x -= 2) {
          const t = t0 + (x / w) * win;
          const y = mid + 2 * env(t) * amp;
          cx.lineTo(x, y);
        }
        cx.closePath();
        const grad = cx.createLinearGradient(0, mid - 2 * amp, 0, mid + 2 * amp);
        grad.addColorStop(0,   'rgba(233,237,245,.04)');
        grad.addColorStop(0.5, running ? 'rgba(233,237,245,.14)' : 'rgba(233,237,245,.07)');
        grad.addColorStop(1,   'rgba(233,237,245,.04)');
        cx.fillStyle = grad;
        cx.fill();

        /* frozen inner wave: sum = 2 * env(t) * carrier(x) */
        cx.beginPath();
        for (let x = 0; x <= w; x += 1) {
          const t = t0 + (x / w) * win;
          const c = carrier[Math.min(carrierN, Math.round((x / w) * carrierN))];
          const y = mid - 2 * env(t) * amp * c;
          x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
        }
        cx.strokeStyle = running ? 'rgba(233,237,245,.72)' : 'rgba(233,237,245,.35)';
        cx.lineWidth = 1.0;
        cx.stroke();

        /* crisp outer envelope line on top */
        cx.beginPath();
        for (let x = 0; x <= w; x += 2) {
          const t = t0 + (x / w) * win;
          const y = mid - 2 * env(t) * amp;
          x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
        }
        for (let x = w; x >= 0; x -= 2) {
          const t = t0 + (x / w) * win;
          const y = mid + 2 * env(t) * amp;
          cx.lineTo(x, y);
        }
        cx.strokeStyle = 'rgba(63,193,255,.85)';
        cx.lineWidth = 1.2;
        cx.stroke();

        /* moving dot at the right edge — advances only while running */
        if (running) {
          const yNow = mid - 2 * env(tau) * amp;
          const halo = cx.createRadialGradient(w - 2, yNow, 0, w - 2, yNow, 15);
          halo.addColorStop(0, 'rgba(255,138,91,.55)');
          halo.addColorStop(1, 'rgba(255,138,91,0)');
          cx.fillStyle = halo;
          cx.beginPath(); cx.arc(w - 2, yNow, 15, 0, Math.PI * 2); cx.fill();

          cx.beginPath();
          cx.arc(w - 2, yNow, 6, 0, Math.PI * 2);
          cx.fillStyle = '#ff8a5b';
          cx.fill();
        }
      }

      /* Animation clock advances only while running, so stop = freeze. */
      let animTau = 0, lastPerf = 0;

      function tick(now) {
        requestAnimationFrame(tick);
        const dt = lastPerf ? Math.min((now - lastPerf) / 1000, 0.1) : 0;
        lastPerf = now;

        if (sweeping && ac) {
          const pr = (ac.currentTime - sweepStart) / SWEEP_DUR;
          if (pr >= 1) {
            stopSweep();
          } else {
            S.beat = 60 * Math.pow(pr, 2.2);
            bSlider.value = sliderFromB(S.beat);
            applyFreqs(); syncLabels();
          }
        }

        if (running) animTau += dt;
        draw(animTau);
      }

      /* ------------------------------------------------------------------ boot */
      fSlider.value = sliderFromF(S.freq);
      bSlider.value = sliderFromB(S.beat);
      vSlider.value = S.vol;
      fitCanvas();
      applyLanguage();
      syncLabels();
      requestAnimationFrame(tick);

      })();
    </script>
  </body>
</html>
